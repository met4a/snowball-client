name: Build

# Builds the client mod, the Windows installers and the Microsoft Store package from source.
# Runs for release tags (v1.2.0, ...) and can be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci

      - name: Test launcher
        working-directory: launcher
        run: npm test

      - name: Build client mod and installers
        working-directory: launcher
        run: npm run dist

      - name: Build Microsoft Store package
        working-directory: launcher
        run: npx electron-builder --win appx --publish never

      - name: Upload installers
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: snowball-client-windows
          path: |
            launcher/release/SnowballClient-*-setup.exe
            launcher/release/SnowballClient-*-portable.exe
            launcher/release/SnowballClient-*.appx
          if-no-files-found: error

      # Signing runs only once SignPath Foundation has approved the project and the two secrets
      # exist. Until then the step is skipped and the build stays unsigned, which the verify step
      # below reports honestly rather than hiding.
      - name: Sign installers with SignPath
        id: sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: snowball-client
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: launcher/release

      # Always runs. It prints the signature status of every artefact and fails the build if
      # anything is signed badly or by the wrong publisher. An unsigned build is allowed through
      # only while no certificate exists, and only because it is stated explicitly here.
      - name: Verify signatures
        working-directory: launcher
        shell: pwsh
        env:
          SNOWBALL_ALLOW_UNSIGNED: ${{ secrets.SIGNPATH_API_TOKEN == '' && '1' || '0' }}
        run: npm run verify:signature

      - name: Checksums
        working-directory: launcher/release
        shell: pwsh
        run: |
          # Published with the release so people can check what they downloaded.
          Get-ChildItem -Include *.exe, *.appx -Recurse -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Tee-Object -FilePath SHA256SUMS.txt
