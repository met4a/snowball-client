name: Aurora probe (temporary)

# Temporary, for the branch that brings the Aurora-style features in: compiles and tests every
# Minecraft version, prints the Minecraft signatures the new mixins are written against, and starts
# the game under a virtual display to take the menu screenshots. Removed before the branch is merged.
on:
  push:
    branches: ['claude/aurora-client-parity-jaf4s0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and test the modern versions
        working-directory: client
        run: ./gradlew build buildAndCollect --continue --stacktrace

      - name: Build the 1.8.9 version
        if: always()
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew -p legacy build buildAndCollect --continue 2>&1 | tee ../legacy-build.log

      - name: Check generated sources
        if: always()
        run: node client/tools/check-generated.mjs

      - name: Minecraft signatures
        if: always()
        run: |
          set +e
          classes="
            net.minecraft.client.renderer.LevelRenderer
            net.minecraft.client.renderer.GameRenderer
            net.minecraft.client.Camera
            net.minecraft.client.MouseHandler
            net.minecraft.client.renderer.SubmitNodeCollector
            net.minecraft.client.renderer.SubmitNodeStorage
            net.minecraft.client.renderer.MultiBufferSource
            net.minecraft.client.renderer.MultiBufferSource\$BufferSource
            net.minecraft.client.renderer.RenderType
            net.minecraft.client.renderer.rendertype.RenderType
            net.minecraft.client.renderer.rendertype.RenderTypes
            net.minecraft.client.renderer.state.CameraRenderState
            net.minecraft.client.renderer.state.LevelRenderState
            net.minecraft.client.gui.Font
            net.minecraft.client.gui.Font\$DisplayMode
            com.mojang.blaze3d.vertex.PoseStack
            com.mojang.blaze3d.vertex.VertexConsumer
            net.minecraft.world.entity.player.PlayerModelType
          "
          for jar in $(find ~/.gradle client -name '*.jar' 2>/dev/null | grep -iE 'minecraft-(merged|client|common)|minecraft/.*client' | grep -viE 'sources|lwjgl' | sort -u); do
            echo "################ $jar"
            for c in $classes; do
              out=$(javap -p -cp "$jar" "$c" 2>/dev/null)
              if [ -n "$out" ]; then echo "---- $c"; echo "$out"; fi
            done
          done
          for jar in $(find ~/.gradle -name 'fabric-rendering-v1-*.jar' 2>/dev/null | grep -v sources | sort -u); do
            echo "################ $jar"
            for c in $(unzip -Z1 "$jar" | grep -E 'api/client/rendering/v1/.*(World|Level|world/|level/).*\.class$' | grep -v '\$Lambda' | sed 's/\.class$//; s|/|.|g'); do
              echo "---- $c"; javap -p -cp "$jar" "$c" 2>/dev/null
            done
          done
          exit 0

      - name: Start the game under a virtual display
        if: always()
        working-directory: client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :26.2:runClientGameTest --stacktrace 2>&1 | tee ../gametest.log

      - name: Start 1.21.11 under a virtual display
        if: always()
        working-directory: client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :1.21.11:runClientGameTest --stacktrace 2>&1 | tee ../gametest-1.21.11.log

      # Last, so the end of the job log holds what failed without scrolling.
      - name: Summary
        if: always()
        run: |
          echo "==== 1.8.9 build ===="
          grep -nE "error:|e: |What went wrong|> Could not|FAILED|BUILD (SUCCESSFUL|FAILED)" -A4 legacy-build.log | head -120 || true
          for log in gametest.log gametest-1.21.11.log; do
            echo "==== game test: $log ===="
            grep -nE "FrameWatch|Flash:|Mixin apply|InvalidInjection|InjectionError|Caused by|Exception in|has crashed|No frame flashed|Skins|Capes|tests? (passed|failed)|BUILD (SUCCESSFUL|FAILED)" "$log" | grep -v "OpenAL\|flite\|SignedJWT\|profile key pair\|certificates" | head -80 || true
          done

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            client/versions/*/build/run/**/screenshots/**
          if-no-files-found: warn
