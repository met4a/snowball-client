<!doctype html>
<!-- YouTube profile picture, 800x800. YouTube shows it as a circle down to 98px (and 24px in
     comments), so the snowball sits well inside the circle and nothing else competes with it.
     Same blue as the app icon (launcher/build-resources/icon.png). Rendered by render.cjs. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 800px; height: 800px; overflow: hidden; background: #0b2a57; }
  .art {
    position: relative; width: 800px; height: 800px;
    background: linear-gradient(180deg, #2468c6 0%, #174a93 55%, #0b2a57 100%);
  }
  /* A soft light behind the snowball so it reads at thumbnail size. */
  .glow {
    position: absolute; left: 50%; top: 50%; width: 640px; height: 640px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(170, 225, 255, 0.34) 0%, rgba(127, 203, 255, 0.12) 42%, rgba(127, 203, 255, 0) 70%);
  }
  /* logo.png is 256px pixel art; scaled by a whole number so every pixel stays square. */
  .ball {
    position: absolute; left: 50%; top: 50%; width: 768px; height: 768px; transform: translate(-50%, -50%);
    image-rendering: pixelated;
    filter: drop-shadow(0 18px 26px rgba(3, 14, 34, 0.45));
  }
</style>
</head>
<body>
  <div class="art">
    <div class="glow"></div>
    <img class="ball" src="../../website/assets/logo.png" alt="">
  </div>
</body>
</html>
