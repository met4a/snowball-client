<!doctype html>
<!-- Discord application cover image, 1024x576 (Rich Presence "cover image" size). The YouTube
     banner's look at a smaller size: the logo and the name fill more of the frame, because Discord
     shows it small; the version chips and website are left off for the same reason. Rendered by
     render.cjs. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Monocraft'; src: url('../../website/assets/fonts/monocraft.ttf') format('truetype'); }
  :root { --bg: #05070a; --accent: #7fcbff; --text: #f2f6fa; }
  html, body { margin: 0; width: 1024px; height: 576px; overflow: hidden; background: var(--bg); }
  .art {
    position: relative; width: 1024px; height: 576px; overflow: hidden;
    background:
      radial-gradient(ellipse 620px 290px at 50% 47%, rgba(36, 104, 198, 0.36) 0%, rgba(36, 104, 198, 0) 70%),
      linear-gradient(180deg, #0a1a33 0%, #081326 45%, var(--bg) 100%);
  }
  canvas { position: absolute; inset: 0; }
  .centre {
    position: absolute; left: 0; right: 0; top: 0; height: 520px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .logo { position: relative; width: 256px; height: 256px; margin: -24px -26px; flex: none; }
  .logo .glow {
    position: absolute; inset: 20px;
    background: radial-gradient(circle, rgba(170, 225, 255, 0.30) 0%, rgba(127, 203, 255, 0.10) 45%, rgba(127, 203, 255, 0) 70%);
  }
  .logo img { position: absolute; inset: 0; width: 256px; height: 256px; image-rendering: pixelated; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5)); }
  .words { font-family: 'Monocraft', monospace; color: var(--text); display: flex; flex-direction: column; gap: 14px; }
  .name { font-size: 52px; line-height: 1; letter-spacing: 2px; white-space: nowrap; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
  .name b { color: var(--accent); font-weight: inherit; }
  .line { font-size: 22px; line-height: 1.1; color: #cfe6f7; white-space: nowrap; }
</style>
</head>
<body>
  <div class="art">
    <canvas id="snow" width="1024" height="576"></canvas>
    <div class="centre">
      <div class="logo"><div class="glow"></div><img src="../../website/assets/logo.png" alt=""></div>
      <div class="words">
        <div class="name">SNOWBALL <b>CLIENT</b></div>
        <div class="line">Free Minecraft client and launcher</div>
      </div>
    </div>
  </div>
<script>
  // Pixel snow, the same every time it is drawn (seeded), thinner behind the logo and the words.
  let seed = 20261018;
  const rand = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ctx = document.getElementById('snow').getContext('2d');
  const inCentre = (x, y) => x > 150 && x < 880 && y > 150 && y < 370;
  const inWords = (x, y) => x > 380 && x < 870 && y > 175 && y < 345;
  for (let i = 0; i < 520; i++) {
    const x = Math.floor(rand() * 1024), y = Math.floor(rand() * 576);
    if (inWords(x, y) || (inCentre(x, y) && rand() < 0.85)) continue;
    const size = [3, 3, 4, 4, 4, 5, 6, 8][Math.floor(rand() * 8)];
    const alpha = 0.10 + rand() * (size >= 6 ? 0.55 : 0.35);
    ctx.fillStyle = `rgba(${rand() < 0.3 ? '180, 225, 255' : '242, 246, 250'}, ${alpha.toFixed(2)})`;
    ctx.fillRect(x - (x % 2), y - (y % 2), size, size);
  }
  // Drifts of snow blocks along the bottom.
  for (let x = 0; x < 1024; x += 16) {
    const h = 32 + Math.floor((Math.sin(x / 90) * 0.5 + 0.5) * 3) * 16 + (rand() < 0.3 ? 16 : 0);
    for (let y = 576 - h; y < 576; y += 16) {
      const shade = 225 + Math.floor(rand() * 25);
      ctx.fillStyle = `rgba(${shade - 20}, ${shade}, ${Math.min(255, shade + 8)}, ${y === 576 - h ? 0.95 : 0.8})`;
      ctx.fillRect(x, y, 16, 16);
      ctx.fillStyle = 'rgba(5, 7, 10, 0.10)';
      ctx.fillRect(x, y + 14, 16, 2);
    }
  }
</script>
</body>
</html>
