plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		client {
			// Keep the dev run directory out of the source tree root.
			runDir = 'run'
		}
	}
}

fabricApi {
	// Real in-game UI tests: `./gradlew runClientGameTest` launches the client, drives the menu and takes screenshots.
	configureTests {
		createSourceSet = true
		modId = 'snowballclient-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName
	from('../LICENSE') {
		rename { "${it}_$projectName" }
	}
}

// Website screenshots in real worlds: ./gradlew runClientGameTest -Pscene
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (project.hasProperty('scene')) systemProperty 'snowball.scene', 'true'
}
